name: Test plugin

on:
  push:
    branches: ["main", "plugin-management"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: python -m pip install packaging
      - name: Validate manifest
        shell: python
        run: |
          import json
          from pathlib import Path
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version
          data = json.loads(Path("plugin.json").read_text(encoding="utf-8"))
          assert data["id"] == "processing"
          assert data["api_version"] == 1
          assert data["requires"] == ["classroom"]
          assert data["execution"] == "in_process"
          assert data["route_prefix"] is None
          assert data["rpc_api_version"] is None
          assert data["rpc_permissions"] == []
          assert data["python_requires"] == [{
              "requirement": "Pillow>=10.0",
              "import": "PIL",
              "label": "Pillow",
              "optional": False,
          }]
          assert SpecifierSet(data["app_requires"]).contains(Version("0.2.0.dev0"), prereleases=True)
      - name: Check Python syntax
        run: python -m compileall -q __init__.py plugin.py extraction.py routes.py services.py scripts/build_registry_artifact.py
      - name: Reject host package relative imports and sibling plugin imports
        shell: bash
        run: |
          if grep -REn 'from \.\.(\.|[A-Za-z_])' --include='*.py' . --exclude-dir=.git; then
            echo "External plugin must use fuckclassroom.* for host imports" >&2
            exit 1
          fi
          if grep -REn 'plugins\.(transcription|ocr|ai_summary)|from \.(\.)?(transcription|ocr|ai_summary)' --include='*.py' . --exclude-dir=.git; then
            echo "processing must not import sibling plugin implementations" >&2
            exit 1
          fi
      - name: Smoke-build Registry v1 artifact
        shell: bash
        run: |
          python scripts/build_registry_artifact.py 0.1.0-ci.0
          sha256sum -c processing-0.1.0-ci.0.zip.sha256
